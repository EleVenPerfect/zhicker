services:
  app:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    # 仅 bind mount 到宿主机目录时设置：让容器以宿主机用户身份写入数据。
    # 命名卷保持默认 10001。
    user: "${PUID:-10001}:${PGID:-10001}"
    ports:
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    volumes:
      - zhihu_data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    init: true

volumes:
  zhihu_data:
